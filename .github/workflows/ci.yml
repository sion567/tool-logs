name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 测试（含 in-process sshd 集成测试）
        run: cargo test --all-features
      - name: Clippy 零警告
        run: cargo clippy --all-targets -- -D warnings
