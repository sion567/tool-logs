[package]
name = "logtail"
version = "0.6.0"
edition = "2021"

[dependencies]
# 异步底座（russh 依赖）
tokio = { version = "1", features = ["full"] }
# SSH（§2 锁 0.44；russh-keys 0.45 起并入 russh::keys，升级时只改 ssh/stream.rs 边界）
russh = "0.44"
russh-keys = "0.44"
# russh 0.44 的 client/server Handler 是 async_trait，impl 侧需要同一宏
async-trait = "0.1"
# TUI
ratatui = "0.26"
crossterm = "0.27"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 正则 / 时间
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"
# 错误 / 自身日志
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 剪贴板（Day6 详情 `c`）
arboard = "3"

# Windows 下 dev 全量调试符号链接极慢（Defender 扫描放大），开发期不生成调试符号
[profile.dev]
debug = 0


[profile.release]
lto = "thin"
strip = true
